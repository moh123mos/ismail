<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لعبة الجمع والطرح — نسخة محسّنة</title>
  <style>
    :root {
      --bg: #0b1020;
      --brand: #ff9800;
      --brand-dark: #fb8c00;
      --panel: #111217;
      --accent: #ffb366;
      --blue: #4FC3F7;
      --fuchsia: #ff77d1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Cairo", sans-serif
    }

    body {
      background: var(--bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      gap: 12px;
      padding: 14px
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%
    }

    .banner-wrap {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      background: #fff;
      display: flex;
      justify-content: center
    }

    .banner-wrap img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover
    }

    .h1-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 40px;
    }

    h1 {
      color: var(--brand);
      text-shadow: 2px 2px #000;
      font-size: 1.6rem;
      margin-top: 6px
    }

    .credit {
      color: #ffd966;
      font-weight: 700
    }

    .toolbar,
    .students {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 10px;
      width: 92%
    }

    .group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--panel)
    }

    .label {
      font-weight: 700;
      color: var(--brand-dark)
    }

    .label.blue {
      color: var(--blue)
    }

    button {
      cursor: pointer;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 8px 12px
    }

    input,
    select {
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff
    }

    #problem {
      font-size: 2.0rem;
      margin: 18px 0;
      text-align: center;
      line-height: 1.4;
      min-width: 320px;
      width: 92%
    }

    .choices {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 10px 0;
      width: 92%
    }

    .choice {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: #000;
      font-size: 1.1rem;
      cursor: pointer
    }

    .choice:hover {
      background: var(--brand-dark)
    }

    /* تظليل الإجابات */
    .choice.correct {
      background: #4CAF50 !important;
      color: #fff !important;
      border: 2px solid #2e7d32 !important;
    }

    .choice.wrong {
      background: #d32f2f !important;
      color: #fff !important;
      border: 2px solid #9a0007 !important;
    }

    .status {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      min-height: 28px
    }

    .face {
      font-size: 48px;
      margin-top: 8px;
      min-height: 50px;
      transition: transform 0.3s
    }

    .face.sad {
      animation: shake 0.5s
    }

    @keyframes shake {
      0% {
        transform: translateX(0)
      }

      25% {
        transform: translateX(-8px)
      }

      50% {
        transform: translateX(8px)
      }

      75% {
        transform: translateX(-8px)
      }

      100% {
        transform: translateX(0)
      }
    }

    #timerDisplay {
      font-size: 20px;
      font-weight: bold;
      margin-top: 6px;
      color: #00e676;
      text-shadow: 1px 1px #000
    }

    .vert-wrapper {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 8px;
      justify-content: center;
      direction: ltr;
    }

    .op-sign {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--brand);
      padding: 6px 10px;
      background: #111;
      border-radius: 8px;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .big-rect table {
      border-collapse: collapse;
      background: transparent
    }

    .big-rect td {
      width: 64px;
      height: 64px;
      border: 2px solid #fff;
      border-radius: 6px;
      font-size: 2.2rem;
      padding: 6px;
      text-align: center;
      vertical-align: middle
    }

    .big-rect .sep td {
      border-top: 4px solid #fff;
      padding: 0;
      height: 10px;
      background: transparent
    }

    .units-row td {
      font-size: 0.95rem;
      padding-bottom: 8px;
      height: 36px;
      background: transparent;
      color: #ffd;
      font-weight: 700
    }

    .results-area {
      width: 92%
    }

    table {
      border-collapse: collapse;
      margin-top: 12px;
      width: 100%;
      background: #111;
      color: #fff
    }

    th,
    td {
      border: 1px solid #333;
      padding: 8px 10px;
      text-align: center;
      font-size: 15px
    }

    tr.gold {
      background-color: #FFD70033
    }

    tr.silver {
      background-color: #C0C0C033
    }

    tr.bronze {
      background-color: #CD7F3233
    }

    .medal {
      font-size: 1.1rem;
      margin-left: 6px
    }

    .banner-medal {
      font-size: 28px;
      font-weight: 800;
      margin: 6px 0
    }

    .banner-name {
      font-size: 22px;
      margin-top: 6px
    }

    .banner-close {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 0, 0, 0.8);
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 10001;
    }

    .banner-close:hover {
      background: rgba(255, 0, 0, 1);
      transform: scale(1.1);
    }

    #resultsBanner {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      color: #fff;
      border-radius: 24px;
      padding: 40px 35px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255,255,255,0.3);
      z-index: 10000;
      min-width: 320px;
      max-width: 95%;
      animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      border: 3px solid rgba(255, 215, 0, 0.6);
    }

    #resultsBanner::before {
      content: '';
      position: absolute;
      inset: -10px;
      background: linear-gradient(45deg, #ff0080, #ff8c00, #40e0d0, #ff0080);
      border-radius: 28px;
      opacity: 0;
      z-index: -1;
      animation: rotateBorder 3s linear infinite;
    }

    #resultsBanner.show::before {
      opacity: 0.6;
    }

    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05);
      }
      70% {
        transform: translate(-50%, -50%) scale(0.9);
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes fadeOut {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
    }

    #bannerOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      backdrop-filter: blur(5px);
    }

    .banner-title {
      font-size: 2.5rem;
      margin-bottom: 25px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .winner-row {
      background: rgba(255, 255, 255, 0.15);
      padding: 20px;
      margin: 15px 0;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .winner-row:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.25);
    }

    .winner-row.first {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 223, 0, 0.5));
      border: 3px solid #FFD700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .winner-row.second {
      background: linear-gradient(135deg, rgba(192, 192, 192, 0.3), rgba(211, 211, 211, 0.5));
      border: 3px solid #C0C0C0;
    }

    .winner-row.third {
      background: linear-gradient(135deg, rgba(205, 127, 50, 0.3), rgba(184, 115, 51, 0.5));
      border: 3px solid #CD7F32;
    }

    .winner-medal {
      font-size: 3.5rem;
      animation: rotate3d 3s ease-in-out infinite;
    }

    @keyframes rotate3d {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
    }

    .winner-info {
      text-align: right;
    }

    .winner-name {
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 5px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .winner-stats {
      font-size: 1.1rem;
      opacity: 0.95;
    }

    .footer-note {
      margin-top: 10px;
      color: #aaa;
      font-size: 0.9rem;
      text-align: center
    }

    @media (max-width:720px) {
      h1 {
        font-size: 1.2rem
      }

      #problem {
        font-size: 1.4rem
      }

      .big-rect td {
        width: 42px;
        height: 48px;
        font-size: 1.6rem
      }

      .op-sign {
        font-size: 2.6rem
      }
    }
  </style>
</head>

      </select>
    </div>
    <div class="group"><span class="label">زمن السؤال (ث):</span><input type="number" id="timerInput" value="20" min="5"
        max="90"></div>
    <div class="group"><button id="toggleNums">🔢 الأرقام: هندية</button></div>
    <div class="group"><button id="toggleSound">🔊 الصوت: تشغيل</button></div>
  </div>

  <div class="students" style="width:92%">
    <input type="text" id="newStudent" placeholder="أدخل اسم الطالب">
    <button id="addStudent">➕ إضافة طالب</button>
    <select id="studentSelect" style="min-width:300px;height:70px;font-size:30px;padding:6px;"></select>
    <button id="deleteStudent">🗑 حذف الطالب</button>
    <button id="deleteAll">🗑 حذف الجميع</button>
  </div>

  <div style="display:flex;gap:8px;align-items:center;width:92%;justify-content:center">
    <button id="startBtn">🚀 ابدأ اللعب</button>
    <button id="regenerateBtn" style="display:none">🔁 أعد توليد السؤال</button>
  </div>

  <div id="problem" aria-live="polite"></div>
  <div class="choices" id="choices" role="list"></div>
  <div id="timerDisplay">⏱ 00</div>
  <div class="status" style="font-size: 30px;" id="status"></div>
  <div class="face" id="face"></div>

  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:92%;justify-content:center">
    <button id="exportBtn">📥 تصدير النتائج</button>
    <input type="file" id="importFile" accept=".xlsx,.csv">
    <button id="resetResults">🔄 إعادة ضبط النتائج</button>
    <button id="finalizeResultsBtn">🎤 نتيجة المسابقة</button>
  </div>

  <div class="results-area">
    <table id="resultsTable" aria-live="polite">
      <thead>
        <tr>
          <th>الطالب</th>
          <th>صحيحة</th>
          <th>خاطئة</th>
          <th>الزمن (ث)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="footer-note">نسخة تفاعلية محلية — تعمل مباشرة في المتصفح دون اتصال.</div>

  <div id="bannerOverlay"></div>
  <div id="resultsBanner" role="dialog" aria-modal="true">
    <button class="banner-close" aria-label="إغلاق">✖</button>
    <div id="bannerContent"></div>
  </div>
  <audio id="player" hidden></audio>
  <!-- مكتبات -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    /* ===== إعدادات عامة ===== */
    let students = [], results = {}, currentStudent = null, timer = null;
    let timerDuration = 20, correctAnsGlobal = null, gameStarted = false, answered = false;
    let useArabicIndic = true;
    let soundOn = true, availableVoices = [];
    let currentTimeLeft = 0;
    const praisePhrases = ["أحسنت يا {name}!", "ممتاز يا {name}!", "عمل رائع يا {name}!", "مبدع يا {name}!", "رائع جدًا يا {name}!"];
    const negativePhrases = ["حاول مرة أخرى يا {name}.", "قربت جدًا يا {name}.", "أعد التفكير يا {name}."];

    /* ===== حفظ وتحميل من Local Storage ===== */
    const STORAGE_KEY_STUDENTS = 'add_minus_students';
    const STORAGE_KEY_RESULTS = 'add_minus_results';

    function saveToLocalStorage() {
      try {
        localStorage.setItem(STORAGE_KEY_STUDENTS, JSON.stringify(students));
        localStorage.setItem(STORAGE_KEY_RESULTS, JSON.stringify(results));
      } catch (e) {
        console.error('خطأ في حفظ البيانات:', e);
      }
    }

    function loadFromLocalStorage() {
      try {
        const savedStudents = localStorage.getItem(STORAGE_KEY_STUDENTS);
        const savedResults = localStorage.getItem(STORAGE_KEY_RESULTS);
        
        if (savedStudents) {
          students = JSON.parse(savedStudents);
          const sel = document.getElementById('studentSelect');
          sel.innerHTML = '';
          students.forEach(name => {
            const opt = document.createElement('option');
            opt.value = opt.textContent = name;
            sel.appendChild(opt);
          });
        }
        
        if (savedResults) {
          results = JSON.parse(savedResults);
        }
      } catch (e) {
        console.error('خطأ في تحميل البيانات:', e);
      }
    }

    /* ===== ألوان للخانات ===== */
    const colors = ["#f44336", "#4caf50", "#2196f3", "#ff9800", "#9c27b0", "#00bcd4"];
    function getRandomColors(n) { 
      let arr = []; 
      for (let i = 0; i < n; i++) { 
        arr.push(colors[i % colors.length]); 
      } 
      return arr.sort(() => Math.random() - 0.5); 
    }

    /* ===== تحويل أرقام (الهندية) ===== */
    function toArabicNumber(num) {
      const s = String(num);
      if (!useArabicIndic) return s;
      return s.replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
    }

    /* ===== صوت ElevenLabs ===== */
    async function generateVoice(text) {
      const player = document.getElementById("player");
      if (!text.trim()) {
        alert("Please enter text first!");
        return;
      }
      const apiKey = "sk_80c831ceb22cab8dc351a9d581112ba704a7c01564a0c510";
      const voiceId = "3nav5pHC1EYvWOd5LmnA"; // haytham Arabic
      const url = `https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`;
      const body = {
        text: text,
        model_id: "eleven_multilingual_v2",
        voice_settings: {
          stability: 0.5,
          similarity_boost: 0.7
        }
      };
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "xi-api-key": apiKey
          },
          body: JSON.stringify(body)
        });
        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        player.src = audioUrl;
        player.play();
      } catch (error) {
        console.error(error);
        alert("Error generating voice. Check your API key or text.");
      }
    }

    async function speak(text) {
      if (!soundOn) return;
      await generateVoice(text);
    }

    /* ===== دوال مساعدة ===== */
    function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    /* ===== توليد الأرقام للجمع والطرح ===== */
    function generateNumbers(d, type) {
      let num1, num2;
      if (type === "add_no_carry") {
        let arr1 = [], arr2 = [];
        for (let i = 0; i < d; i++) { 
          let a = Math.floor(Math.random() * 10); 
          let b = Math.floor(Math.random() * (10 - a)); 
          arr1.push(a); 
          arr2.push(b); 
        } 
        num1 = parseInt(arr1.join('')) || 0; 
        num2 = parseInt(arr2.join('')) || 0;
    } else if (type === "add_carry") {
      let arr1 = [], arr2 = [];
      for (let i = 0; i < d; i++) { 
        let a = Math.floor(Math.random() * 10), b = Math.floor(Math.random() * 10);
        if (d === 2 && i === d - 1) {
        // للآحاد فقط: تأكد من وجود carry
        while (a + b < 10) { 
          a = Math.floor(Math.random() * 10); 
          b = Math.floor(Math.random() * 10); 
        }
        } else if (d === 2 && i < d - 1) {
        // للعشرات: لا carry
        while (a + b >= 10) {
          a = Math.floor(Math.random() * 10); 
          b = Math.floor(Math.random() * 10);
        }
        }
        arr1.push(a); 
        arr2.push(b); 
      } 
      num1 = parseInt(arr1.join('')) || 0; 
      num2 = parseInt(arr2.join('')) || 0;
      } else if (type === "sub_no_borrow") {
        let arr1 = [], arr2 = [];
        for (let i = 0; i < d; i++) { 
          let a = Math.floor(Math.random() * 10); 
          let b = Math.floor(Math.random() * (a + 1)); 
          arr1.push(a); 
          arr2.push(b); 
        } 
        num1 = parseInt(arr1.join('')) || 0; 
        num2 = parseInt(arr2.join('')) || 0;
      } else if (type === "sub_borrow") {
        let arr1 = [], arr2 = [];
        let borrowIndex = Math.floor(Math.random() * d);
        for (let i = 0; i < d; i++) { 
          let a = Math.floor(Math.random() * 10); 
          let b = Math.floor(Math.random() * 10); 
          if (i === borrowIndex) { 
            while (a >= b) { 
              a = Math.floor(Math.random() * 10); 
              b = Math.floor(Math.random() * 10); 
            } 
          } else { 
            while (a < b) { 
              a = Math.floor(Math.random() * 10); 
              b = Math.floor(Math.random() * 10); 
            } 
          } 
          arr1.push(a); 
          arr2.push(b); 
        } 
        num1 = parseInt(arr1.join('')) || 0; 
        num2 = parseInt(arr2.join('')) || 0; 
        if (num2 > num1) { 
          [num1, num2] = [num2, num1]; 
        }
      }
      return [num1, num2];
    }

    /* ===== المؤقت ===== */
    function startTimer() {
      clearInterval(timer);
      timerDuration = parseInt(document.getElementById('timerInput').value) || 20;
      currentTimeLeft = timerDuration;
      document.getElementById('timerDisplay').textContent = '⏱ ' + toArabicNumber(currentTimeLeft);
      timer = setInterval(() => {
        currentTimeLeft--;
        document.getElementById('timerDisplay').textContent = '⏱ ' + toArabicNumber(currentTimeLeft);
        if (currentTimeLeft <= 0) { 
          clearInterval(timer); 
          checkAnswer(null, true); 
        }
      }, 1000);
    }

    /* ===== عرض سؤال جديد ===== */
    let currentQuestion = null;
    function newProblem(markUsed = true) {
      document.getElementById('choices').innerHTML = '';
      document.getElementById('status').textContent = '';
      document.getElementById('face').textContent = '';
      answered = false;

      const d = parseInt(document.getElementById('digits').value) || 2;
      const type = document.getElementById('operationType').value;
      const layout = document.getElementById('layout').value;
      let [num1, num2] = generateNumbers(d, type);
      const op = type.includes('add') ? '+' : '-';
      correctAnsGlobal = (op === '+') ? (num1 + num2) : (num1 - num2);

      if (layout === 'horizontal') {
        document.getElementById('problem').innerHTML = `<div style="font-size:2.0rem">${toArabicNumber(num1)} ${op} ${toArabicNumber(num2)} = ?</div>`;
      } else {
        const maxLen = d;
        const n1 = num1.toString().padStart(maxLen, '0').split('');
        const n2 = num2.toString().padStart(maxLen, '0').split('');
        const unitNames = ['آحاد', 'عشرات', 'مئات', 'آلاف', 'عشرات آلاف', 'مئات آلاف'];
        const unitsOrdered = unitNames.slice(0, maxLen).reverse();
        const cellColors = getRandomColors(maxLen);

        let table = `<div class="vert-wrapper"><div class="big-rect"><table><tbody>`;
        table += `<tr class="units-row">`;
        for (let i = 0; i < maxLen; i++) { table += `<td>${unitsOrdered[i]}</td>`; }
        table += `</tr>`;
        table += `<tr>`;
        for (let i = 0; i < maxLen; i++) { table += `<td style="background:${cellColors[i]};">${toArabicNumber(n1[i])}</td>`; }
        table += `</tr>`;
        table += `<tr>`;
        for (let i = 0; i < maxLen; i++) { table += `<td style="background:${cellColors[i]};">${toArabicNumber(n2[i])}</td>`; }
        table += `</tr>`;
        table += `<tr class="sep"><td colspan="${maxLen}"></td></tr>`;
        table += `</tbody></table></div><div class="op-sign">${op}</div></div>`;
        document.getElementById('problem').innerHTML = table;
      }

      const numChoices = parseInt(document.getElementById('numChoices').value, 10) || 3;
      let answers = [correctAnsGlobal];
      const spread = Math.max(3, Math.floor(String(correctAnsGlobal).length * 3));
      while (answers.length < numChoices) {
        let delta = Math.floor(Math.random() * spread) + 1;
        let wrong = correctAnsGlobal + (Math.random() < 0.5 ? -delta : delta);
        if (wrong >= 0 && !answers.includes(wrong)) answers.push(wrong);
      }
      answers.sort(() => Math.random() - 0.5);

      const choicesDiv = document.getElementById('choices');
      answers.forEach(a => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.textContent = toArabicNumber(a);
        btn.onclick = () => checkAnswer(a);
        choicesDiv.appendChild(btn);
      });

      startTimer();
    }

    /* ===== التحقق من الإجابة مع تظليل الأزرار ===== */
    function checkAnswer(ans, markUsed = true) {
      if (!gameStarted) { 
        alert('⚠️ اضغط على زر ابدأ اللعبة أولاً'); 
        return; 
      }
      if (answered) return;
      answered = true;
      clearInterval(timer);

      const studentName = currentStudent || '';
      let correct = (ans === correctAnsGlobal);

      // تظليل الأزرار بناءً على النتيجة
      const buttons = document.querySelectorAll('.choice');
      buttons.forEach(btn => {
        const btnValue = parseInt(btn.textContent.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)));
        if (btnValue === correctAnsGlobal) {
          btn.classList.add('correct');
        } else if (btnValue === ans && !correct) {
          btn.classList.add('wrong');
        }
      });

      const elapsed = (timerDuration - (typeof currentTimeLeft === 'number' ? currentTimeLeft : 0));
      if (markUsed && studentName) {
        if (!results[studentName]) results[studentName] = { ok: 0, bad: 0, time: 0 };
        if (correct) {
          results[studentName].ok++;
          const phrase = praisePhrases[rnd(0, praisePhrases.length - 1)].replace('{name}', studentName);
          document.getElementById('status').textContent = `✅ ${phrase}`;
          document.getElementById('face').textContent = '🎉';
          speak(phrase);
          try { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); } catch (e) { }
        } else {
          results[studentName].bad++;
          const phrase = negativePhrases[rnd(0, negativePhrases.length - 1)].replace('{name}', studentName);
          document.getElementById('status').textContent = `❌ ${phrase}`;
          document.getElementById('face').textContent = '😢';
          document.getElementById('face').classList.add('sad');
          setTimeout(() => document.getElementById('face').classList.remove('sad'), 600);
          speak(phrase);
        }
        results[studentName].time = (results[studentName].time || 0) + elapsed;
      } else {
        if (correct) {
          document.getElementById('status').textContent = `✅ إجابة صحيحة!`;
          document.getElementById('face').textContent = '🎉';
        } else {
          document.getElementById('status').textContent = `❌ إجابة خاطئة`;
          document.getElementById('face').textContent = '😢';
        }
      }

      saveToLocalStorage();
      updateTable();
      pickNextStudent();

      document.getElementById('startBtn').style.display = 'inline-block';
      gameStarted = false;
    }

    /* ===== اختيار طالب تالي ===== */
    function pickNextStudent() {
      const sel = document.getElementById('studentSelect');
      if (!sel || students.length === 0) return;
      let idx = students.indexOf(currentStudent);
      if (idx === -1) currentStudent = students[0];
      else currentStudent = students[(idx + 1) % students.length];
      document.getElementById('studentSelect').value = currentStudent || '';
      if (currentStudent && !results[currentStudent]) results[currentStudent] = { ok: 0, bad: 0, time: 0 };
    }

    /* ===== ترتيب وتحديث الجدول ===== */
    function getSortedResultsArray() {
      return Object.entries(results)
        .map(([name, r]) => ({
          name,
          ok: r.ok || 0,
          bad: r.bad || 0,
          time: r.time || 0,
          perc: (r.ok + r.bad) ? Math.round(r.ok / (r.ok + r.bad) * 100) : 0
        }))
        .sort((a, b) => {
          if (b.perc !== a.perc) return b.perc - a.perc;
          if (b.ok !== a.ok) return b.ok - a.ok;
          return a.time - b.time;
        });
    }

    function updateTable() {
      const tbody = document.querySelector('#resultsTable tbody');
      tbody.innerHTML = '';

      const sorted = getSortedResultsArray();

      for (let i = 0; i < sorted.length; i++) {
        const r = sorted[i];
        let cls = '';
        if (i === 0) cls = 'gold';
        else if (i === 1) cls = 'silver';
        else if (i === 2) cls = 'bronze';
        sorted[i].cls = cls;
      }

      sorted.forEach((r) => {
        const tr = document.createElement('tr');
        if (r.cls) tr.classList.add(r.cls);
        let medal = '';
        if (r.cls === 'gold') medal = '<span class="medal">🥇</span>';
        else if (r.cls === 'silver') medal = '<span class="medal">🥈</span>';
        else if (r.cls === 'bronze') medal = '<span class="medal">🥉</span>';
        tr.innerHTML = `
          <td>${medal}${r.name}</td>
          <td>${r.ok}</td>
          <td>${r.bad}</td>
          <td>${r.time}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    /* ===== أزرار ووظائف واجهة المستخدم ===== */
    document.getElementById('startBtn').addEventListener('click', () => {
      const sel = document.getElementById('studentSelect').value;
      if (!sel) { 
        alert('اختر طالبًا'); 
        return; 
      }
      currentStudent = sel;
      if (!results[currentStudent]) results[currentStudent] = { ok: 0, bad: 0, time: 0 };
      timerDuration = parseInt(document.getElementById('timerInput').value) || 20;

      newProblem();
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('regenerateBtn').style.display = 'inline-block';
      gameStarted = true;
    });

    document.getElementById('regenerateBtn').addEventListener('click', () => {
      if (!gameStarted) { 
        alert('ابدأ اللعبة أولاً'); 
        return; 
      }
      newProblem(false);
    });

    // إضافة طالب
    document.getElementById('addStudent').addEventListener('click', () => {
      const name = document.getElementById('newStudent').value.trim();
      if (name && !students.includes(name)) {
        students.push(name);
        results[name] = { ok: 0, bad: 0, time: 0 };
        const opt = document.createElement('option'); 
        opt.value = opt.textContent = name;
        document.getElementById('studentSelect').appendChild(opt);
        document.getElementById('newStudent').value = '';
        saveToLocalStorage();
        updateTable();
      }
    });

    // حذف طالب
    document.getElementById('deleteStudent').addEventListener('click', () => {
      const sel = document.getElementById('studentSelect'); 
      const name = sel.value;
      if (name && confirm(`هل تريد حذف ${name}?`)) {
        students = students.filter(s => s !== name);
        delete results[name];
        const opt = document.querySelector(`#studentSelect option[value="${name}"]`);
        if (opt) opt.remove();
        currentStudent = null;
        saveToLocalStorage();
        updateTable();
      }
    });

    // حذف الجميع
    document.getElementById('deleteAll').addEventListener('click', () => {
      if (confirm('هل تريد حذف جميع الطلاب؟')) {
        students = []; 
        results = {}; 
        document.getElementById('studentSelect').innerHTML = '';
        saveToLocalStorage();
        updateTable();
      }
    });

    // تبديل الأرقام (الهندية <-> العربية)
    const toggleNumsBtn = document.getElementById('toggleNums');
    function refreshToggleNumsText() { 
      toggleNumsBtn.textContent = useArabicIndic ? '🔢 الأرقام: هندية' : '🔢 الأرقام: عربية'; 
    }
    toggleNumsBtn.addEventListener('click', () => {
      useArabicIndic = !useArabicIndic;
      refreshToggleNumsText();
      if (gameStarted) newProblem();
    });
    refreshToggleNumsText();

    // تشغيل/إيقاف الصوت
    document.getElementById('toggleSound').addEventListener('click', () => {
      soundOn = !soundOn;
      document.getElementById('toggleSound').textContent = soundOn ? '🔊 الصوت: تشغيل' : '🔇 الصوت: إيقاف';
    });

    // تصدير النتائج
    document.getElementById('exportBtn').addEventListener('click', () => {
      const wb = XLSX.utils.book_new();
      const ws_data = [["الطالب", "صحيحة", "خاطئة", "الزمن (ثواني)"]];
      for (const [name, r] of Object.entries(results)) {
        const perc = (r.ok + r.bad) ? Math.round(r.ok / (r.ok + r.bad) * 100) : 0;
        ws_data.push([name, r.ok, r.bad, r.time || 0]);
      }
      const ws = XLSX.utils.aoa_to_sheet(ws_data);
      XLSX.utils.book_append_sheet(wb, ws, "النتائج");
      XLSX.writeFile(wb, "add_minus_game_results.xlsx");
    });

    // استيراد نتائج
    document.getElementById('importFile').addEventListener('change', e => {
      const file = e.target.files[0]; 
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (evt) {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
        students = []; 
        results = {}; 
        document.getElementById('studentSelect').innerHTML = '';
        json.slice(1).forEach(row => { 
          const name = row[0]; 
          if (name) { 
            students.push(name); 
            results[name] = { ok: row[1] || 0, bad: row[2] || 0, time: row[3] || 0 }; 
            const opt = document.createElement('option'); 
            opt.value = opt.textContent = name; 
            document.getElementById('studentSelect').appendChild(opt); 
          } 
        });
        saveToLocalStorage();
        updateTable();
      };
      reader.readAsArrayBuffer(file);
    });

    // إعادة ضبط النتائج
    document.getElementById('resetResults').addEventListener('click', () => {
      if (confirm('هل تريد إعادة ضبط نتائج جميع الطلاب للصفر؟')) {
        for (const s of students) results[s] = { ok: 0, bad: 0, time: 0 }; 
        saveToLocalStorage();
        updateTable();
      }
    });

    // تحميل الأصوات والبيانات عند الفتح
    window.addEventListener('load', () => { 
      loadFromLocalStorage();
      updateTable();
    });

    /* ===== زر حسم النتيجة (النهائي) + شريط التهنئة ===== */
    const finalizeBtn = document.getElementById('finalizeResultsBtn');
    const banner = document.getElementById('resultsBanner');
    const bannerContent = document.getElementById('bannerContent');
    const bannerClose = document.querySelector('#resultsBanner .banner-close');
    const bannerOverlay = document.getElementById('bannerOverlay');

    function showBannerForTop3(top3) {
      const medals = ['🥇', '🥈', '🥉'];
      const classes = ['first', 'second', 'third'];
      const titles = ['🎊 المركز الأول 🎊', '🌟 المركز الثاني 🌟', '✨ المركز الثالث ✨'];
      
      let html = '<div class="banner-title">🏆 نتائج المسابقة النهائية 🏆</div>';
      
      top3.forEach((p, i) => {
        const cls = classes[i];
        html += `
          <div class="winner-row ${cls}">
            <div class="winner-medal">${medals[i]}</div>
            <div class="winner-info">
              <div class="winner-name">${p.name}</div>
              <div class="winner-stats">✅ ${p.ok} صحيح | ❌ ${p.bad} خاطئ | 📊 ${p.perc}%</div>
            </div>
          </div>
        `;
      });
      
      bannerContent.innerHTML = html;
      bannerOverlay.style.display = 'block';
      banner.style.display = 'block';
      banner.classList.add('show');
      
      // مؤثرات الكونفيتي المتعددة
      setTimeout(() => {
        try {
          // كونفيتي من اليسار
          confetti({
            particleCount: 150,
            angle: 60,
            spread: 100,
            origin: { x: 0, y: 0.6 },
            colors: ['#FFD700', '#FFA500', '#FF69B4', '#00CED1']
          });
          // كونفيتي من اليمين
          confetti({
            particleCount: 150,
            angle: 120,
            spread: 100,
            origin: { x: 1, y: 0.6 },
            colors: ['#FFD700', '#FFA500', '#FF69B4', '#00CED1']
          });
        } catch (e) { }
      }, 200);
      
      // موجة ثانية من الكونفيتي
      setTimeout(() => {
        try {
          confetti({
            particleCount: 100,
            spread: 120,
            origin: { y: 0.4 },
            colors: ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1']
          });
        } catch (e) { }
      }, 800);
      
      // نجوم متلألئة
      setTimeout(() => {
        try {
          confetti({
            particleCount: 50,
            spread: 360,
            ticks: 200,
            gravity: 0,
            decay: 0.94,
            startVelocity: 30,
            shapes: ['star'],
            colors: ['#FFD700', '#FFA500', '#FFE873']
          });
        } catch (e) { }
      }, 1200);
    }

    function hideBanner() {
      banner.style.animation = 'fadeOut 0.4s ease both';
      setTimeout(() => {
        banner.style.display = 'none';
        banner.classList.remove('show');
        bannerOverlay.style.display = 'none';
        bannerContent.innerHTML = '';
        banner.style.animation = '';
      }, 400);
      speak('شكرًا لمشاركتكم جميعًا!');
    }
    bannerClose.addEventListener('click', hideBanner);
    bannerOverlay.addEventListener('click', hideBanner);

    finalizeBtn.addEventListener('click', () => {
      const sorted = getSortedResultsArray();
      if (!sorted.length) { 
        alert('لا توجد نتائج لحسمها بعد.'); 
        return; 
      }
      const top3 = sorted.slice(0, 3);
      
      // النص الصوتي مع المزيد من الحماس
      let speechText = '🎉 تهانينا! نتيجة المسابقة النهائية! ';
      if (top3[0]) {
        speechText += `المركز الأول يحصل عليه المتسابق المتميز ${top3[0].name} بعدد ${top3[0].ok} إجابة صحيحة! مبروك! `;
      }
      if (top3[1]) {
        speechText += `المركز الثاني للمتسابق الرائع ${top3[1].name}! `;
      }
      if (top3[2]) {
        speechText += `والمركز الثالث للمتسابق ${top3[2].name}! `;
      }
      speechText += 'مبروك للجميع وألف مبروك للفائزين!';
      
      showBannerForTop3(top3);
      speak(speechText);
      
      // إخفاء تلقائي بعد 20 ثانية
    //   setTimeout(hideBanner, 20000);
    });

    /* ===== تحديث أولي للجدول ===== */
    updateTable();

  </script>
</body>

</html>
