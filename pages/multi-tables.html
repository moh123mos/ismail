<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لعبة جداول الضرب</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    body {
      background: var(--bg) url('../imgs/tables.png') no-repeat center center fixed;
      background-size: cover;
    }

    /* كبير على الشاشات الواسعة فقط؛ على الموبايل يبقى حجم style.css */
    @media (min-width: 721px) {
      #problem {
        font-size: 4rem;
      }
    }

    .choice {
      font-size: 2rem;
    }

    .h1-row {
      font-size: 40px !important;
    }

    .table-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 1200px;
      width: 92%;
    }

    .table-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      cursor: pointer;
      min-width: 64px;
    }

    .table-btn.active,
    .special-btn.active {
      background: var(--brand);
      color: #000;
      border: 2px solid #ff9c1a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 152, 0, 0.12);
    }

    .special-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      cursor: pointer;
      min-width: 120px;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="../common.js"></script>
  <script src="../game-shell.js"></script>
  <script>
    /* ===== سجل الأسئلة المستخدمة في الجلسة (يُمسح عند بدء كل لعبة) ===== */
    const used = GameShell.createUsedStore();

    /* ===== أزرار الجداول (2..12) + وضعان خاصان ===== */
    const tableOptions = [];
    for (let t = 2; t <= 12; t++) { tableOptions.push({ type: 'table', val: t }); }
    tableOptions.push({ type: '1x2', label: 'ضرب رقم × رقمين' });
    tableOptions.push({ type: '2x2', label: 'ضرب رقمين × رقمين' });

    function createTableButtons() {
      const container = document.getElementById('tableButtonsContainer');
      const prevActive = Array.from(container.querySelectorAll('button.active')).map(b => b.dataset.type + (b.dataset.val ? ':' + b.dataset.val : ''));
      container.innerHTML = '';
      tableOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.dataset.type = opt.type;
        if (opt.type === 'table') {
          btn.className = 'table-btn';
          btn.dataset.val = opt.val;
          btn.textContent = '× ' + toArabicNumber(opt.val);
          btn.title = 'اضغط للاختيار: جدول ' + opt.val;
        } else {
          btn.className = 'special-btn';
          btn.textContent = opt.label;
          btn.title = 'اضغط للاختيار: ' + opt.label;
        }
        btn.addEventListener('click', () => btn.classList.toggle('active'));
        // إعادة تفعيل الأزرار التي كانت فعّالة قبلاً
        const key = btn.dataset.type + (btn.dataset.val ? ':' + btn.dataset.val : '');
        if (prevActive.includes(key)) btn.classList.add('active');
        container.appendChild(btn);
      });
    }

    function getSelectedModes() {
      return Array.from(document.querySelectorAll('#tableButtonsContainer button.active')).map(b => {
        const t = b.dataset.type;
        return t === 'table' ? { type: 'table', val: parseInt(b.dataset.val, 10) } : { type: t };
      });
    }

    /* ===== توليد سؤال ضرب بناء على الإعدادات المختارة ===== */
    function genMultiplicationQuestion() {
      const selected = getSelectedModes();
      let a, b;
      const opt = selected.length ? selected[rnd(0, selected.length - 1)] : null;
      if (opt && opt.type === 'table') { a = opt.val; b = rnd(1, 12); }
      else if (opt && opt.type === '1x2') { a = rnd(1, 9); b = rnd(10, 99); }
      else if (opt && opt.type === '2x2') { a = rnd(10, 99); b = rnd(10, 99); }
      else { a = rnd(2, 9); b = rnd(1, 12); }   // لا اختيار: أسئلة عشوائية
      return { display: `${toArabicNumber(a)} × ${toArabicNumber(b)} = ?`, solution: a * b, key: `${a}×${b}` };
    }

    /* ===== بناء السؤال (تستدعيه المنصة عند بدء كل جولة) ===== */
    function buildQuestion(ctx) {
      // توليد سؤال غير مكرر
      let q;
      let attempts = 0;
      do {
        q = genMultiplicationQuestion();
        attempts++;
      } while (used.has(q.key) && attempts < 50);
      if (ctx.counted) used.add(q.key);

      const numChoices = parseInt(document.getElementById('numChoices').value, 10) || 3;
      const answers = [q.solution];
      const spread = Math.max(3, Math.floor(String(q.solution).length * 3));
      while (answers.length < numChoices) {
        const delta = rnd(1, Math.max(spread, Math.round(q.solution * 0.15) + 1));
        let wrong = q.solution + (Math.random() < 0.5 ? -delta : delta);
        if (wrong < 0) wrong = Math.abs(wrong) + delta;
        if (!answers.includes(wrong)) answers.push(wrong);
      }
      answers.sort(() => Math.random() - 0.5);

      return { html: `<div>${q.display}</div>`, choices: answers, answer: q.solution };
    }

    GameShell.mount({
      id: 'multi-tables',
      storagePrefix: 'mul_game',        // مفتاح التخزين القديم: نحافظ عليه كي لا تضيع بيانات الطلاب المحفوظة
      title: 'لعبة جداول الضرب',
      heading: '🎯 لعبة جداول الضرب',
      banner: { src: '../imgs/tables.png', alt: 'لعبة جداول الضرب' },
      exportFilename: 'multiplication_game_results.xlsx',
      settingsHTML: `
        <div class="toolbar" style="margin-top:6px">
          <div class="group"><span class="label">اختر جداول الضرب (اضغط للتفعيل):</span></div>
        </div>
        <div class="table-buttons" id="tableButtonsContainer" aria-label="أزرار جداول الضرب"></div>
        <div class="toolbar" style="margin-top:6px">
          <div class="group"><span class="label">عدد الخيارات:</span>
            <select id="numChoices">
              <option value="3">3 خيارات</option>
              <option value="4">4 خيارات</option>
            </select>
          </div>
        </div>`,
      onReady: createTableButtons,
      onNumbersToggle: createTableButtons,   // أرقام أزرار الجداول تتبع نوع الأرقام
      onStart() {
        if (getSelectedModes().length === 0 &&
          !confirm('لم تختَر أي جدول أو وضع خاص. هل ترغب في الاستمرار بتوليد أسئلة ضرب عشوائية؟')) return false;
        used.clear();
      },
      buildQuestion
    });
  </script>
</body>

</html>
