<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لعبة الجمع والطرح</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    body {
      background: var(--bg) url('../imgs/math.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .vert-wrapper {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 8px;
      justify-content: center;
      direction: ltr;
    }

    .op-sign {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--brand);
      padding: 6px 10px;
      background: #111;
      border-radius: 8px;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .big-rect table {
      border-collapse: collapse;
      background: transparent;
    }

    .big-rect td {
      width: 64px;
      height: 64px;
      border: 2px solid #fff;
      border-radius: 6px;
      font-size: 2.2rem;
      padding: 6px;
      text-align: center;
      vertical-align: middle;
    }

    .big-rect .sep td {
      border-top: 4px solid #fff;
      padding: 0;
      height: 10px;
      background: transparent;
    }

    .units-row td {
      font-size: 0.95rem;
      padding-bottom: 8px;
      height: 36px;
      background: transparent;
      color: #ffd;
      font-weight: 700;
    }

    @media (max-width: 720px) {
      .big-rect td {
        width: 42px;
        height: 48px;
        font-size: 1.6rem;
      }

      .op-sign {
        font-size: 2.6rem;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="../common.js"></script>
  <script src="../game-shell.js"></script>
  <script>
    /* ===== سجل الأسئلة المستخدمة في الجلسة (يُمسح عند بدء كل لعبة) ===== */
    const used = GameShell.createUsedStore();

    /* ===== توليد الأرقام للجمع والطرح ===== */
    function generateNumbers(d, type) {
      let num1, num2;
      if (type === "add_no_carry") {
        let arr1 = [], arr2 = [];
        for (let i = 0; i < d; i++) {
          let a = Math.floor(Math.random() * 10);
          let b = Math.floor(Math.random() * (10 - a));
          arr1.push(a);
          arr2.push(b);
        }
        num1 = parseInt(arr1.join('')) || 0;
        num2 = parseInt(arr2.join('')) || 0;
      } else if (type === "add_carry") {
        let arr1 = [], arr2 = [];
        for (let i = 0; i < d; i++) {
          let a = Math.floor(Math.random() * 10), b = Math.floor(Math.random() * 10);
          if (d === 2 && i === d - 1) {
            // للآحاد فقط: تأكد من وجود carry
            while (a + b < 10) {
              a = Math.floor(Math.random() * 10);
              b = Math.floor(Math.random() * 10);
            }
          } else if (d === 2 && i < d - 1) {
            // للعشرات: لا carry
            while (a + b >= 10) {
              a = Math.floor(Math.random() * 10);
              b = Math.floor(Math.random() * 10);
            }
          }
          arr1.push(a);
          arr2.push(b);
        }
        num1 = parseInt(arr1.join('')) || 0;
        num2 = parseInt(arr2.join('')) || 0;
      } else if (type === "sub_no_borrow") {
        let arr1 = [], arr2 = [];
        for (let i = 0; i < d; i++) {
          let a = Math.floor(Math.random() * 10);
          let b = Math.floor(Math.random() * (a + 1));
          arr1.push(a);
          arr2.push(b);
        }
        num1 = parseInt(arr1.join('')) || 0;
        num2 = parseInt(arr2.join('')) || 0;
      } else if (type === "sub_borrow") {
        let arr1 = [], arr2 = [];
        let borrowIndex = Math.floor(Math.random() * d);
        for (let i = 0; i < d; i++) {
          let a = Math.floor(Math.random() * 10);
          let b = Math.floor(Math.random() * 10);
          if (i === borrowIndex) {
            while (a >= b) {
              a = Math.floor(Math.random() * 10);
              b = Math.floor(Math.random() * 10);
            }
          } else {
            while (a < b) {
              a = Math.floor(Math.random() * 10);
              b = Math.floor(Math.random() * 10);
            }
          }
          arr1.push(a);
          arr2.push(b);
        }
        num1 = parseInt(arr1.join('')) || 0;
        num2 = parseInt(arr2.join('')) || 0;
        if (num2 > num1) {
          [num1, num2] = [num2, num1];
        }
      }
      return [num1, num2];
    }

    /* ===== بناء السؤال (تستدعيه المنصة عند بدء كل جولة) ===== */
    function buildQuestion(ctx) {
      const d = parseInt(document.getElementById('digits').value) || 2;

      // أنواع العمليات وطرق العرض المحددة
      const selectedOperations = Array.from(document.querySelectorAll('input[name="operationType"]:checked')).map(cb => cb.value);
      if (selectedOperations.length === 0) {
        alert('⚠️ يجب اختيار نوع عملية واحد على الأقل');
        return null;
      }
      const type = selectedOperations[rnd(0, selectedOperations.length - 1)];

      const selectedLayouts = Array.from(document.querySelectorAll('input[name="layout"]:checked')).map(cb => cb.value);
      if (selectedLayouts.length === 0) {
        alert('⚠️ يجب اختيار طريقة عرض واحدة على الأقل');
        return null;
      }
      const layout = selectedLayouts[rnd(0, selectedLayouts.length - 1)];

      // توليد سؤال غير مكرر
      let num1, num2, op, questionKey;
      let attempts = 0;
      do {
        [num1, num2] = generateNumbers(d, type);
        op = type.includes('add') ? '+' : '-';
        questionKey = `${num1}${op}${num2}`;
        attempts++;
      } while (used.has(questionKey) && attempts < 50);
      if (ctx.counted) used.add(questionKey);

      const answer = (op === '+') ? (num1 + num2) : (num1 - num2);

      let html;
      if (layout === 'horizontal') {
        html = `<div style="font-size:2.0rem">${toArabicNumber(num1)} ${op} ${toArabicNumber(num2)} = ?</div>`;
      } else {
        const maxLen = d;
        const n1 = num1.toString().padStart(maxLen, '0').split('');
        const n2 = num2.toString().padStart(maxLen, '0').split('');
        const unitNames = ['آحاد', 'عشرات', 'مئات', 'آلاف', 'عشرات آلاف', 'مئات آلاف'];
        const unitsOrdered = unitNames.slice(0, maxLen).reverse();
        const cellColors = getRandomColors(maxLen);

        html = `<div class="vert-wrapper"><div class="big-rect"><table><tbody>`;
        html += `<tr class="units-row">`;
        for (let i = 0; i < maxLen; i++) { html += `<td>${unitsOrdered[i]}</td>`; }
        html += `</tr><tr>`;
        for (let i = 0; i < maxLen; i++) { html += `<td style="background:${cellColors[i]};">${toArabicNumber(n1[i])}</td>`; }
        html += `</tr><tr>`;
        for (let i = 0; i < maxLen; i++) { html += `<td style="background:${cellColors[i]};">${toArabicNumber(n2[i])}</td>`; }
        html += `</tr><tr class="sep"><td colspan="${maxLen}"></td></tr>`;
        html += `</tbody></table></div><div class="op-sign">${op}</div></div>`;
      }

      // الخيارات
      const numChoices = parseInt(document.getElementById('numChoices').value, 10) || 3;
      const answers = [answer];
      const spread = Math.max(3, Math.floor(String(answer).length * 3));
      while (answers.length < numChoices) {
        const delta = Math.floor(Math.random() * spread) + 1;
        const wrong = answer + (Math.random() < 0.5 ? -delta : delta);
        if (wrong >= 0 && !answers.includes(wrong)) answers.push(wrong);
      }
      answers.sort(() => Math.random() - 0.5);

      return { html, choices: answers, answer };
    }

    GameShell.mount({
      id: 'math-operations',
      storagePrefix: 'add_minus',       // مفتاح التخزين القديم: نحافظ عليه كي لا تضيع بيانات الطلاب المحفوظة
      title: 'لعبة الجمع والطرح',
      heading: '🎮 لعبة الجمع والطرح',
      banner: { src: '../imgs/math.jpg', alt: 'لعبة الجمع والطرح' },
      exportFilename: 'add_minus_game_results.xlsx',
      settingsHTML: `
        <div class="toolbar" style="margin-top:6px">
          <div class="group"><span class="label">عدد الأرقام:</span><input type="number" id="digits" value="2" min="1" max="6"></div>
          <div class="group"><span class="label">عدد الخيارات:</span>
            <select id="numChoices">
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </div>
        </div>

        <div class="toolbar" style="margin-top:10px">
          <div class="group" style="flex-direction: column; align-items: flex-start; gap: 8px;">
            <span class="label" style="font-size: 20px; font-weight: bold;">نوع العملية:</span>
            <div class="checkbox-group">
              <label class="checkbox-option checked">
                <input type="checkbox" name="operationType" value="add_no_carry" checked>
                <span>➕ جمع بدون إعادة تجميع</span>
              </label>
              <label class="checkbox-option">
                <input type="checkbox" name="operationType" value="add_carry">
                <span>➕ جمع بإعادة تجميع</span>
              </label>
              <label class="checkbox-option">
                <input type="checkbox" name="operationType" value="sub_no_borrow">
                <span>➖ طرح بدون استلاف</span>
              </label>
              <label class="checkbox-option">
                <input type="checkbox" name="operationType" value="sub_borrow">
                <span>➖ طرح بالاستلاف</span>
              </label>
            </div>
          </div>
        </div>

        <div class="toolbar" style="margin-top:10px">
          <div class="group" style="flex-direction: column; align-items: flex-start; gap: 8px;">
            <span class="label" style="font-size: 20px; font-weight: bold;">طريقة العرض:</span>
            <div class="checkbox-group">
              <label class="checkbox-option checked">
                <input type="checkbox" name="layout" value="vertical" checked>
                <span>عمودية</span>
              </label>
              <label class="checkbox-option">
                <input type="checkbox" name="layout" value="horizontal">
                <span>أفقية</span>
              </label>
            </div>
          </div>
        </div>`,
      onStart() { used.clear(); },
      buildQuestion
    });
  </script>
</body>

</html>
