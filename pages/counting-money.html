<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لعبة عدّ النقود السعودية</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* only what is specific to this game; the look comes from ../style.css */
    :root { --game: oklch(0.87 0.12 85); }

    .money-target {
      font-size: clamp(1.9rem, 1.2rem + 2.6vw, 3.5rem);
    }

    .money-amount {
      color: oklch(0.5 0.17 33);
    }

    /* the riyal notes and coins: big tappable buttons showing the real pictures */
    .money-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
      gap: var(--s-4);
      justify-items: center;
      align-items: start;
      margin-block: var(--s-4);
    }

    .currency-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--s-2);
      min-height: 0;
      padding: var(--s-2);
      border-radius: 1.5rem;
      background: transparent;
      box-shadow: none;
    }

    @media (hover: hover) {
      .currency-item:not(:disabled):hover {
        transform: translateY(-4px) rotate(1.5deg);
      }
    }

    .currency-item:not(:disabled):active {
      transform: scale(0.95);
      box-shadow: none;
    }

    .currency-item:disabled {
      opacity: 0.45;
      filter: grayscale(1);
    }

    .currency-img {
      width: min(100%, 10.5rem);
      height: auto;
      border-radius: 0.75rem;
      box-shadow: 0 0 0 3px var(--ink), 0 0.35rem 0 3px oklch(0.27 0.06 250 / 0.25);
      object-fit: cover;
      background: var(--white);
    }

    .currency-item .coin-img {
      width: 6.5rem;
      height: 6.5rem;
      border-radius: 50%;
    }

    .currency-label {
      display: inline-flex;
      align-items: center;
      gap: var(--s-2);
      padding: 0 var(--s-4);
      min-height: 2.5rem;
      border-radius: 999px;
      background: var(--white);
      font-weight: 700;
      font-size: 1.05rem;
    }

    @media (max-width: 40rem) {
      .money-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--s-3);
      }

      .currency-item .coin-img {
        width: 5.25rem;
        height: 5.25rem;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="../common.js"></script>
  <script src="../game-shell.js"></script>
  <script>
    /* ===== حالة الجولة ===== */
    let targetAmount = 0;
    let currentAmount = 0;
    let roundCounted = true;   // false بعد "أعد توليد السؤال": لا تُحسب في النتائج

    const LEVELS = {
      easy: [5, 25],
      medium: [26, 80],
      hard: [81, 150],
      pro: [151, 300]
    };

    // ورقة المئة ريال تظهر في المستويين الصعب والخبير فقط
    function updateLevelDisplay() {
      const level = document.getElementById('level').value;
      document.getElementById('item-100').hidden = !(level === 'hard' || level === 'pro');
    }

    function renderProblem() {
      document.getElementById('problem').innerHTML = `
        <div class="money-target">اجمع <span class="money-amount">${toArabicNumber(targetAmount)}</span> ريال سعودي</div>
        <div class="problem-hint">المبلغ الحالي: <span id="currentDisplay">${toArabicNumber(currentAmount)}</span> ريال</div>`;
    }

    function setBillsDisabled(disabled) {
      document.querySelectorAll('.currency-item').forEach(item => { item.disabled = disabled; });
    }

    /* ===== جولة جديدة (تستدعيها المنصة) ===== */
    function newRound(ctx, { counted }) {
      roundCounted = counted;
      const [min, max] = LEVELS[document.getElementById('level').value] || LEVELS.easy;
      targetAmount = rnd(min, max);
      currentAmount = 0;
      renderProblem();
      setBillsDisabled(false);
      startTimer(() => finish(false, '❌ الوقت انتهى!'));
    }

    function finish(correct, message) {
      setBillsDisabled(true);
      // نترك ثانيتين لعرض النتيجة قبل الانتقال للطالب التالي
      game.finishRound(correct, { counted: roundCounted, message, delay: 2000 });
    }

    function addMoney(amount, tapIndex) {
      if (!gameStarted || answered) return;
      game.sfx('pop', tapIndex);   // a small blip for every note or coin
      currentAmount += amount;
      document.getElementById('currentDisplay').textContent = toArabicNumber(currentAmount);
      if (currentAmount === targetAmount) finish(true);
      else if (currentAmount > targetAmount) finish(false, '❌ عذراً! تجاوزت المبلغ المطلوب');
    }

    const game = GameShell.mount({
      id: 'counting-money',
      storagePrefix: 'counting_money',   // مفتاح التخزين القديم: نحافظ عليه كي لا تضيع بيانات الطلاب المحفوظة
      title: 'لعبة عدّ النقود السعودية',
      heading: 'لعبة عدّ النقود السعودية',
      emoji: { code: '1f4b8', fallback: '💸' },   // نفس إيموجي جزيرتها على الخريطة
      banner: { src: '../imgs/money-banner.jpg', alt: 'عد النقود السعودية' },
      exportFilename: 'نتائج_عد_النقود.xlsx',
      timer: { value: 30, min: 10, max: 90 },
      intro: 'اختر طالباً واضغط "ابدأ اللعب"',
      footerHTML: '"النقود وسيلة، وليست غاية. استخدمها بحكمة لتحقيق أهدافك."',
      settingsHTML: `
        <div class="toolbar">
          <div class="group">
            <label class="label" for="level">مستوى الصعوبة:</label>
            <select id="level">
              <option value="easy">مبتدئ (5-25 ريال)</option>
              <option value="medium">متوسط (26-80 ريال)</option>
              <option value="hard">صعب (81-150 ريال)</option>
              <option value="pro">خبير (151-300 ريال)</option>
            </select>
          </div>
        </div>`,
      gameAreaHTML: `
        <div class="money-grid">
          <button type="button" class="currency-item" id="item-100" hidden data-val="100">
            <img src="../imgs/currency/100-riyal.png" alt="مائة ريال" class="currency-img">
            <span class="currency-label"><i class="ph-bold ph-money" aria-hidden="true"></i>مائة ريال</span>
          </button>
          <button type="button" class="currency-item" data-val="50">
            <img src="../imgs/currency/50-riyal.png" alt="خمسون ريالاً" class="currency-img">
            <span class="currency-label"><i class="ph-bold ph-money" aria-hidden="true"></i>خمسون ريالاً</span>
          </button>
          <button type="button" class="currency-item" data-val="10">
            <img src="../imgs/currency/10-riyal.png" alt="عشرة ريالات" class="currency-img">
            <span class="currency-label"><i class="ph-bold ph-money" aria-hidden="true"></i>عشرة ريالات</span>
          </button>
          <button type="button" class="currency-item" data-val="5">
            <img src="../imgs/currency/5-riyal.png" alt="خمسة ريالات" class="currency-img">
            <span class="currency-label"><i class="ph-bold ph-money" aria-hidden="true"></i>خمسة ريالات</span>
          </button>
          <button type="button" class="currency-item" data-val="2">
            <img src="../imgs/currency/2-riyal.png" alt="ريالان" class="currency-img coin-img">
            <span class="currency-label"><i class="ph-bold ph-coins" aria-hidden="true"></i>ريالان</span>
          </button>
          <button type="button" class="currency-item" data-val="1">
            <img src="../imgs/currency/1-riyal.png" alt="ريال واحد" class="currency-img coin-img">
            <span class="currency-label"><i class="ph-bold ph-coins" aria-hidden="true"></i>ريال واحد</span>
          </button>
        </div>`,
      newRound,
      onNumbersToggle() {
        // أرقام المسألة الحالية تتبع نوع الأرقام (الصور نفسها لا تتغير)
        if (gameStarted && !answered) renderProblem();
        return false;   // لا نبدّل المسألة، فقط نعيد رسمها
      },
      onReady() {
        document.getElementById('level').addEventListener('change', updateLevelDisplay);
        document.querySelectorAll('.currency-item').forEach((item, i) => {
          item.addEventListener('click', () => addMoney(parseInt(item.dataset.val, 10), i));
        });
        updateLevelDisplay();
      }
    });
  </script>
</body>

</html>
