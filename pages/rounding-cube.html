<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>بطولة مكعب تقريب الأعداد</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    /* only what is specific to this game; the look comes from ../style.css */
    :root { --game: oklch(0.86 0.11 50); }

    /* "123 + 456 = ؟": up to 5-digit numbers twice, so smaller than the single big number */
    .big-expr { font-size: clamp(1.9rem, 0.9rem + 3.6vw, 4rem); }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="../common.js"></script>
  <script src="../game-shell.js"></script>
  <script>
    /* ===== وجوه المكعب: كل وجه نوع من الأسئلة ===== */
    const FACES = [
      { type: 'direct', title: 'تحدي السرعة', icon: 'lightning' },
      { type: 'line', title: 'خط الأعداد', icon: 'ruler' },
      { type: 'error', title: 'المفتش الذكي', icon: 'magnifying-glass' },
      { type: 'add', title: 'اجمع وقرّب', icon: 'plus' },
      { type: 'sub', title: 'اطرح وقرّب', icon: 'minus' },
      { type: 'word', title: 'مسألة بطل', icon: 'crown' }
    ];

    const LEVEL_WORD = { 10: 'عَشَرَةٍ', 100: 'مِئَةٍ', 1000: 'أَلْفٍ' };

    /* مسائل لفظية من الدرس: value = العدد قبل التقريب (الإجابة تُحسب منه، فلا تُكتب بيدٍ فتخطئ) */
    const WORD_BANK = {
      10: [
        { text: 'تَحْتاجُ لَيْلَى إِلَى 67 ريالًا لِتَشْتَرِي حَقِيبَةً، فَكَمْ رِيَالًا تَحْتَاجُ مُقَرِّبًا إِلَى أَقْرَبِ عَشْرَةٍ؟', value: 67 },
        { text: 'وَفَّرَ خَالِدٌ 1486 ريالًا، وَوَفَّرَتْ أُخْتُهُ عَائِشَةُ 1252 ريالًا، مَا الْفَرقُ بَينَ المَبْلَغَينِ مُقَرِّبًا إِلَى أَقْرَبِ عَشَرَةٍ؟', value: 1486 - 1252 },
        { text: 'تَسْتَعْمِلُ رِيمَا الْحَاسُوبَ مُدَّةَ 116 دَقِيقَةً يَوْمِيًّا. كَمْ دَقِيقَةً تَقْرِيبًا تَسْتَعْمِلُ رِيمَا الْحَاسُوبَ مُقَرَّبًا لِأَقْرَبِ عَشَرَةٍ؟', value: 116 }
      ],
      100: [
        { text: 'قَرَأَ حُسَينٌ كِتابًا فِيهِ 267 صَفْحَةً، مَا عَدَدُ الصَّفَحاتِ الَّتِي قَرَأَها مُقَرَّبًا إِلَى أَقْرَبِ مِئَةٍ؟', value: 267 },
        { text: 'جَمَعَتْ سَارَةُ 1423 ريالًا، كَمْ ريالًا جَمَعَتْ سَارَةُ مُقَرِّبًا إِلَى أَقْرَبِ مِئَةٍ؟', value: 1423 },
        { text: 'نَظَمَتْ نورَةُ 228 خَرَزَةً فِي خَيْطٍ. إِذَا أَضَافَتْ إِلَيْهَا 25 خَرَزَةً أُخْرَى، فَكَمْ يُصْبِحُ عَدَدُ الْخَرَزَاتِ مُقَرِّبًا إِلَى أَقْرَبِ مِئَةٍ؟', value: 228 + 25 },
        { text: 'قَطَعَ قِطارٌ مَسافَةَ 1687 كيلومترًا، ما عَدَدُ الكيلومتراتِ الَّتِي قَطَعَهَا الْقِطَارُ مُقَرَّبًا إِلَى أَقْرَبِ مِئَةٍ؟', value: 1687 }
      ],
      1000: [
        { text: 'فِي مَزْرَعَةِ وَالِدِ أَحْمدَ 1250 نَخْلةً، قَرِّب عَدَدَ النَّخِيلِ إِلَى أَقْرَبِ أَلْفٍ.', value: 1250 },
        { text: 'بَلَغَ عَدَدُ حُضُورِ مُباراةِ كُرَةِ قَدَمٍ 6989 شَخْصًا، فَمَا عَدَدُ الْحُضُورِ مُقَرَّبًا إِلَى أَقْرَبِ أَلْفٍ؟', value: 6989 },
        { text: 'فِي مَكْتَبَةِ المَدْرَسةِ 1483 كِتابًا، فَكَمْ كِتابًا فِي المَكْتَبَةِ مُقَرَّبًا إِلَى أَقْرَبِ أَلْفٍ؟', value: 1483 },
        { text: 'رَكِبَ سَعْدٌ الطَّائِرَةَ فِي رِحْلَةِ الذَّهَابِ قَاطِعًا مَسافَةَ 1142 كيلومترًا، فَكَمْ كِيلُومِتْرًا قَطَعَتِ الطَّائِرَةُ ذَهَابًا وَإِيابًا مُقَرِّبًا إِلَى أَقْرَبِ أَلْفٍ؟', value: 1142 * 2 }
      ]
    };

    /* ===== أدوات صغيرة خاصة بهذه اللعبة ===== */
    const pickOne = arr => arr[rnd(0, arr.length - 1)];
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    const checkedValues = name => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(i => i.value);
    const roundTo = (n, lvl) => Math.round(n / lvl) * lvl;   // الخانة ٥ فأكثر ترفع
    const floorTo = (n, lvl) => Math.floor(n / lvl) * lvl;
    const ceilTo = (n, lvl) => Math.ceil(n / lvl) * lvl;

    /* عدد عشوائي بحجم يناسب مستوى التقريب والصعوبة، وليس من مضاعفات الخانة (حتى يحتاج إلى تقريب فعلاً) */
    const RANGES = {
      10: { easy: [11, 99], medium: [101, 999], hard: [1001, 9999] },
      100: { easy: [101, 999], medium: [1001, 9999], hard: [10001, 99999] },
      1000: { easy: [1001, 9999], medium: [10001, 99999], hard: [100001, 999999] }
    };
    function numberFor(lvl, diff, notTie) {
      const [min, max] = RANGES[lvl][diff];
      let n;
      do { n = rnd(min, max); } while (n % lvl === 0 || (notTie && n % lvl === lvl / 2));
      return n;
    }

    /* الخيارات: الإجابة + أخطاء شائعة أولاً + مضاعفات قريبة، كلها مختلفة وغير سالبة */
    function makeChoices(correct, lvl, count, mistakes, avoid) {
      const out = [correct];
      const add = v => { if (out.length < count && v >= 0 && !out.includes(v) && !(avoid || []).includes(v)) out.push(v); };
      (mistakes || []).forEach(add);
      for (let k = 1; out.length < count && k < 30; k++) { add(correct + k * lvl); add(correct - k * lvl); }
      return shuffle(out);
    }

    const num = n => toArabicNumber(n);
    const expr = text => `<span class="expr">${text}</span>`;

    /* ===== أنواع الأسئلة (واحد لكل وجه) ===== */
    const BUILDERS = {
      direct(lvl, diff) {
        const n = numberFor(lvl, diff);
        const answer = roundTo(n, lvl);
        return {
          body: `<div class="problem-hint">قَرِّب العدد إلى أَقْرَبِ ${LEVEL_WORD[lvl]}</div><div>${num(n)}</div>`,
          choices: makeChoices(answer, lvl, 4, [floorTo(n, lvl), ceilTo(n, lvl)]), answer
        };
      },
      line(lvl, diff) {
        const n = numberFor(lvl, diff, true);   // لا نختار منتصفاً تماماً: السؤال "أيهما أقرب" يجب أن يكون له جواب واحد
        const base = floorTo(n, lvl), upper = base + lvl;
        const answer = n - base < upper - n ? base : upper;
        return {
          body: `<div class="problem-text">على خط الأعداد، هل العدد ${expr(num(n))} أقرب إلى ${expr(num(base))} أم إلى ${expr(num(upper))}؟</div>`,
          choices: [base, upper], answer
        };
      },
      error(lvl, diff) {
        const n = numberFor(lvl, diff);
        const answer = roundTo(n, lvl);
        const wrong = answer === ceilTo(n, lvl) ? floorTo(n, lvl) : ceilTo(n, lvl);   // الجار الآخر: خطأ صديقك
        return {
          body: `<div class="problem-text">قَرَّب صديقك العدد ${expr(num(n))} لأقرب ${LEVEL_WORD[lvl]}، فأجاب: ${expr(num(wrong))}.<br>ما هو الصواب؟</div>`,
          choices: makeChoices(answer, lvl, 4, [], [wrong]), answer
        };
      },
      add(lvl, diff) {
        const part = diff === 'hard' ? 'medium' : 'easy';
        const a = numberFor(lvl, part), b = numberFor(lvl, part);
        const sum = a + b;
        const answer = roundTo(sum, lvl);
        return {
          body: `<div class="problem-hint">اجمع أولاً ثم قَرِّب الناتج لأقرب ${LEVEL_WORD[lvl]}</div><div class="big-expr">${expr(`${num(a)} + ${num(b)} = ؟`)}</div>`,
          choices: makeChoices(answer, lvl, 4, [roundTo(a, lvl) + roundTo(b, lvl), floorTo(sum, lvl), ceilTo(sum, lvl)]), answer
        };
      },
      sub(lvl, diff) {
        const part = diff === 'hard' ? 'medium' : 'easy';
        let a, b;
        do { a = numberFor(lvl, part); b = numberFor(lvl, part); } while (Math.abs(a - b) < lvl);   // فرق بحجم يستحق التقريب
        if (b > a) [a, b] = [b, a];
        const diffVal = a - b;
        const answer = roundTo(diffVal, lvl);
        return {
          body: `<div class="problem-hint">اطرح أولاً ثم قَرِّب الناتج لأقرب ${LEVEL_WORD[lvl]}</div><div class="big-expr">${expr(`${num(a)} − ${num(b)} = ؟`)}</div>`,
          choices: makeChoices(answer, lvl, 4, [roundTo(a, lvl) - roundTo(b, lvl), floorTo(diffVal, lvl), ceilTo(diffVal, lvl)]), answer
        };
      },
      word(lvl) {
        let p;
        do { p = pickOne(WORD_BANK[lvl]); } while (recentWords.includes(p) && WORD_BANK[lvl].length > recentWords.length);
        recentWords.push(p); if (recentWords.length > 3) recentWords.shift();
        const answer = roundTo(p.value, lvl);
        return { body: `<div class="problem-text">${toArabicText(p.text)}</div>`, choices: makeChoices(answer, lvl, 4, [floorTo(p.value, lvl), ceilTo(p.value, lvl)]), answer };
      }
    };
    const recentWords = [];
    let lastFace = -1;

    /* ===== بناء السؤال (تستدعيه المنصة عند بدء كل جولة): المكعب "يُرمى" ويحدد النوع ===== */
    function buildQuestion() {
      const levels = checkedValues('level').map(Number);
      const diffs = checkedValues('diff');
      if (!levels.length) { alert('اختر نوع تقريب واحداً على الأقل'); return null; }
      if (!diffs.length) { alert('اختر مستوى صعوبة واحداً على الأقل'); return null; }

      let face;
      do { face = rnd(0, FACES.length - 1); } while (face === lastFace);
      lastFace = face;

      const q = BUILDERS[FACES[face].type](pickOne(levels), pickOne(diffs));
      return { html: GameShell.cubeHTML(FACES, face) + q.body, choices: q.choices, answer: q.answer };
    }

    GameShell.mount({
      id: 'rounding-cube',
      storagePrefix: 'rounding_cube',
      title: 'بطولة مكعب تقريب الأعداد',
      heading: 'بطولة مكعب تقريب الأعداد',
      emoji: { code: '1f3af', fallback: '🎯' },   // نفس إيموجي جزيرتها على الخريطة
      exportFilename: 'نتائج_مكعب_التقريب.xlsx',
      timer: { value: 30, min: 10, max: 90 },
      intro: 'اختر طالباً واضغط «ابدأ اللعب» ليُرمى المكعب ويحدد نوع السؤال',
      settingsHTML: `
        <div class="toolbar">
          <div class="group group--stack">
            <span class="label">التقريب لأقرب:</span>
            <div class="checkbox-group">
              <label class="checkbox-option checked">
                <input type="checkbox" name="level" value="10" checked>
                <i class="ph-bold ph-target" aria-hidden="true"></i><span>عشرة</span>
              </label>
              <label class="checkbox-option checked">
                <input type="checkbox" name="level" value="100" checked>
                <i class="ph-bold ph-target" aria-hidden="true"></i><span>مئة</span>
              </label>
              <label class="checkbox-option checked">
                <input type="checkbox" name="level" value="1000" checked>
                <i class="ph-bold ph-target" aria-hidden="true"></i><span>ألف</span>
              </label>
            </div>
          </div>
        </div>

        <div class="toolbar">
          <div class="group group--stack">
            <span class="label">حجم الأعداد:</span>
            <div class="checkbox-group">
              <label class="checkbox-option checked">
                <input type="checkbox" name="diff" value="easy" checked>
                <i class="ph-bold ph-smiley" aria-hidden="true"></i><span>سهل (أعداد قصيرة)</span>
              </label>
              <label class="checkbox-option checked">
                <input type="checkbox" name="diff" value="medium" checked>
                <i class="ph-bold ph-gauge" aria-hidden="true"></i><span>متوسط (منازل أكبر)</span>
              </label>
              <label class="checkbox-option checked">
                <input type="checkbox" name="diff" value="hard" checked>
                <i class="ph-bold ph-fire" aria-hidden="true"></i><span>صعب (أعداد كبيرة)</span>
              </label>
            </div>
          </div>
        </div>`,
      buildQuestion
    });
  </script>
</body>

</html>
