<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لعبة المعادلات والعبارات الجبرية</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    body {
      background: var(--bg) url('../imgs/eq-banner.png') no-repeat center center fixed;
      background-size: cover;
    }

    .var-blue {
      color: var(--blue);
      font-weight: 700;
    }

    .var-fuchsia {
      color: var(--fuchsia);
      font-weight: 700;
    }

    @media (max-width: 720px) {
      #problem {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="../common.js"></script>
  <script src="../game-shell.js"></script>
  <script>
    /* ===== سجل الأسئلة المستخدمة ===== */
    const used = GameShell.createUsedStore('eq_game_used_questions_final_v1');

    /* ===== دوال مساعدة خاصة بهذه اللعبة ===== */
    function randWithDigits(d) { if (d <= 1) return rnd(0, 9); const min = Math.pow(10, d - 1); const max = Math.pow(10, d) - 1; return rnd(min, max); }

    // دالة للحصول على نوع معادلة عشوائي من المحدد
    function getRandomEquationKind() {
      const checked = Array.from(document.querySelectorAll('input[name="equationKind"]:checked'));
      if (checked.length === 0) {
        alert('يرجى اختيار نوع معادلة واحد على الأقل');
        return 'addsub';
      }
      return checked[rnd(0, checked.length - 1)].value;
    }

    // دالة للحصول على نوع سؤال عشوائي من المحدد
    function getRandomQuestionType() {
      const checked = Array.from(document.querySelectorAll('input[name="questionType"]:checked'));
      if (checked.length === 0) {
        alert('يرجى اختيار نوع سؤال واحد على الأقل');
        return 'solve_equation';
      }
      return checked[rnd(0, checked.length - 1)].value;
    }

    /* ===== دوال التوليد الخاصة بالمعادلات ===== */
    function genEquation(difficulty, digits, equationKind) {
      const numericProb = 0.05;
      const attempts = 80;
      for (let t = 0; t < attempts; t++) {
        const numericOnly = Math.random() < numericProb;
        let q = null;
        if (equationKind === 'addsub') {
          if (numericOnly) {
            const op = Math.random() < 0.5 ? '+' : '-';
            const a = randWithDigits(digits);
            const b = randWithDigits(digits);
            let sol = (op === '+') ? (a + b) : (a - b);
            if (sol < 0) continue;
            q = { display: `${toArabicNumber(a)} ${op} ${toArabicNumber(b)} = ?`, solution: sol, kind: 'numeric' };
          } else {
            const forms = ['x_plus_a', 'a_plus_x', 'x_minus_a', 'a_minus_x'];
            const form = forms[rnd(0, forms.length - 1)];
            let a, b, solution;
            if (difficulty === 'easy') { a = randWithDigits(1); solution = rnd(0, 9); }
            else if (difficulty === 'medium') { a = randWithDigits(Math.min(2, digits)); solution = rnd(0, 20); }
            else { a = randWithDigits(Math.min(2, digits)); solution = rnd(0, 30); }
            if (form === 'x_plus_a') { b = a + solution; q = { display: `س + ${toArabicNumber(a)} = ${toArabicNumber(b)}`, solution: solution, kind: 'variable' }; }
            else if (form === 'a_plus_x') { b = a + solution; q = { display: `${toArabicNumber(a)} + س = ${toArabicNumber(b)}`, solution: solution, kind: 'variable' }; }
            else if (form === 'x_minus_a') { const bval = rnd(0, Math.max(0, 10)); solution = bval + a; q = { display: `س - ${toArabicNumber(a)} = ${toArabicNumber(bval)}`, solution: solution, kind: 'variable' }; }
            else { const bval = rnd(0, a); solution = a - bval; q = { display: `${toArabicNumber(a)} - س = ${toArabicNumber(bval)}`, solution: solution, kind: 'variable' }; }
            if (q.solution < 0) continue;
          }
        } else {
          if (numericOnly) {
            const op = Math.random() < 0.5 ? '×' : '÷';
            if (op === '×') {
              const a = randWithDigits(Math.min(2, digits));
              const b = randWithDigits(Math.min(1, digits));
              const sol = a * b;
              if (sol < 0) continue;
              q = { display: `${toArabicNumber(a)} × ${toArabicNumber(b)} = ?`, solution: sol, kind: 'numeric' };
            } else {
              const b = randWithDigits(Math.min(1, digits)) || 1;
              const sol = rnd(0, 12);
              const a = b * sol;
              if (sol < 0) continue;
              q = { display: `${toArabicNumber(a)} ÷ ${toArabicNumber(b)} = ?`, solution: sol, kind: 'numeric' };
            }
          } else {
            const coeff = rnd(1, 6);
            const solution = rnd(0, 12);
            const a = randWithDigits(Math.min(1, digits));
            const b = coeff * solution + a;
            if (Math.random() < 0.6) {
              if (coeff === 1) q = { display: `س + ${toArabicNumber(a)} = ${toArabicNumber(b)}`, solution: solution, kind: 'variable' };
              else q = { display: `${toArabicNumber(coeff)}س + ${toArabicNumber(a)} = ${toArabicNumber(b)}`, solution: solution, kind: 'variable' };
            } else {
              const coeff2 = rnd(1, 6);
              const sol2 = rnd(0, 12);
              const b2 = coeff2 * sol2;
              q = { display: `${toArabicNumber(coeff2)}س = ${toArabicNumber(b2)}`, solution: sol2, kind: 'variable' };
            }
            if (q.solution < 0) continue;
          }
        }

        const fp = fingerprint({ kind: 'solve', text: q.display });
        if (!used.has(fp)) { used.add(fp); return q; }
      }
      const fallback = { display: 'س + 1 = 2', solution: 1, kind: 'variable' };
      const fp = fingerprint({ kind: 'solve', text: fallback.display });
      if (!used.has(fp)) used.add(fp);
      return fallback;
    }

    const varsPool = ['س', 'ص', 'ع', 'ك', 'ن', 'ل'];
    function getVar() { return varsPool[rnd(0, varsPool.length - 1)]; }
    function getVarColorClass() { return Math.random() < 0.5 ? 'var-blue' : 'var-fuchsia'; }

    function genExpressionForClassify(difficulty, digits) {
      const attempts = 60;
      for (let t = 0; t < attempts; t++) {
        const v = getVar();
        const vClass = getVarColorClass();
        const varHTML = `<span class="${vClass}">${v}</span>`;
        if (Math.random() < 0.5) {
          let a = rnd(1, (difficulty === 'easy' ? 5 : difficulty === 'medium' ? 12 : 30));
          let sol = rnd(0, (difficulty === 'easy' ? 9 : difficulty === 'medium' ? 20 : 30));
          const forms = ['v_plus_a_eq_b', 'a_plus_v_eq_b', 'v_minus_a_eq_b', 'a_minus_v_eq_b'];
          const form = forms[rnd(0, forms.length - 1)];
          let text = '';
          if (form === 'v_plus_a_eq_b') {
            const b = a + sol;
            text = `${varHTML} + ${toArabicNumber(a)} = ${toArabicNumber(b)}`;
          } else if (form === 'a_plus_v_eq_b') {
            const b = a + sol;
            text = `${toArabicNumber(a)} + ${varHTML} = ${toArabicNumber(b)}`;
          } else if (form === 'v_minus_a_eq_b') {
            const b = Math.max(0, rnd(0, (difficulty === 'easy' ? 5 : 10)));
            text = `${varHTML} - ${toArabicNumber(a)} = ${toArabicNumber(b)}`;
          } else {
            const b = Math.max(0, rnd(0, a));
            text = `${toArabicNumber(a)} - ${varHTML} = ${toArabicNumber(b)}`;
          }
          const fp = fingerprint({ type: 'classify', text });
          if (!used.has(fp)) { used.add(fp); return { text, type: 'معادلة' }; }
        } else {
          const count = Math.random() < 0.6 ? 2 : 3;
          let parts = [];
          for (let i = 0; i < count; i++) {
            const coef = Math.random() < 0.6 ? '' : String(randWithDigits(Math.min(2, digits)));
            const term = coef === '' ? varHTML : (toArabicNumber(coef) + varHTML);
            if (i > 0) parts.push((Math.random() < 0.5 ? ' + ' : ' - ') + term);
            else parts.push(term);
          }
          const expr = parts.join('');
          const fp = fingerprint({ type: 'classify', text: expr });
          if (!used.has(fp)) { used.add(fp); return { text: expr, type: 'عبارة جبرية' }; }
        }
      }
      return { text: 'س + 2 = 4', type: 'معادلة' };
    }

    /* ===== بناء السؤال (تستدعيه المنصة عند بدء كل جولة) ===== */
    function buildQuestion() {
      const qType = getRandomQuestionType();
      const diff = document.getElementById('difficulty').value;
      const digits = Math.max(1, parseInt(document.getElementById('digits').value) || 1);
      const eqKind = getRandomEquationKind();

      if (qType === 'solve_equation') {
        const eq = genEquation(diff, digits, eqKind);
        let display = eq.display;
        if (display.includes('س')) {
          display = display.replace(/س/g, `<span class="${getVarColorClass()}">${getVar()}</span>`);
        }
        const answers = [eq.solution];
        while (answers.length < 3) {
          const delta = Math.max(1, rnd(1, 8));
          let wrong = eq.solution + (Math.random() < 0.5 ? -delta : delta);
          if (wrong < 0) wrong = Math.abs(wrong) + delta;
          if (!answers.includes(wrong)) answers.push(wrong);
        }
        answers.sort(() => Math.random() - 0.5);
        return { html: `<div style="font-size:2.0rem">${display}</div>`, choices: answers, answer: eq.solution };
      }

      const ex = genExpressionForClassify(diff, digits);
      return {
        html: `<div style="font-size:2.0rem">${ex.text}</div><div class="small">صنّف العبارة التالية:</div>`,
        choices: ['معادلة', 'عبارة جبرية'],
        answer: ex.type
      };
    }

    GameShell.mount({
      id: 'equations',
      title: 'لعبة المعادلات والعبارات الجبرية',
      heading: '🎯 لعبة المعادلات والعبارات الجبرية',
      banner: { src: '../imgs/eq-banner.png', alt: 'ميزان المعادلات' },
      exportFilename: 'equations_game_results.xlsx',
      used,
      settingsHTML: `
        <div class="toolbar" style="margin-top:6px">
          <div class="group"><span class="label">عدد الأرقام:</span><input type="number" id="digits" value="1" min="1" max="3"></div>
          <div class="group"><span class="label">مستوى:</span>
            <select id="difficulty">
              <option value="easy" selected>سهل</option>
              <option value="medium">متوسط</option>
              <option value="hard">صعب</option>
            </select>
          </div>
        </div>

        <div class="toolbar" style="margin-top:10px">
          <div class="group" style="flex-direction: column; align-items: flex-start; gap: 8px;">
            <span class="label" style="font-size: 20px; font-weight: bold;">نوع المعادلات:</span>
            <div class="checkbox-group">
              <label class="checkbox-option checked">
                <input type="checkbox" name="equationKind" value="addsub" checked>
                <span>➕➖ جمع/طرح</span>
              </label>
              <label class="checkbox-option">
                <input type="checkbox" name="equationKind" value="multiply">
                <span>✖️ ضرب</span>
              </label>
            </div>
          </div>
        </div>

        <div class="toolbar" style="margin-top:10px">
          <div class="group" style="flex-direction: column; align-items: flex-start; gap: 8px;">
            <span class="label blue" style="font-size: 20px; font-weight: bold;">نوع السؤال:</span>
            <div class="checkbox-group">
              <label class="checkbox-option checked">
                <input type="checkbox" name="questionType" value="solve_equation" checked>
                <span>🔢 حل المعادلات</span>
              </label>
              <label class="checkbox-option">
                <input type="checkbox" name="questionType" value="classify">
                <span>📋 تصنيف المعادلات والعبارات</span>
              </label>
            </div>
          </div>
        </div>`,
      buildQuestion
    });
  </script>
</body>

</html>
